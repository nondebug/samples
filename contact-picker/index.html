<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Contact Picker API Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#3f51b5">
</head>
<body>
    <h1>Contact Picker API Demo</h1>
    <p id="requireHTTPS" class="hidden">
        <b>STOP!</b> This page <b>must</b> be served over HTTPS.
        <a>reload this page via HTTPS</a>.
    </p>
    <p id="notSupported">
        <b>Sorry!</b> This browser doesn't support the Contact Picker API.
    </p>
    <ol>
        <li>
            <input type="checkbox" id="multiple">
            <label for="multiple">Multiple results?</label>
        </li>
        <li>
            <input type="checkbox" checked id="name">
            <label for="name">Include name?</label>
        </li>
        <li>
            <input type="checkbox" checked id="email">
            <label for="email">Include email addresses?</label>
        </li>
        <li>
            <input type="checkbox" checked id="tel">
            <label for="tel">Include telephone numbers?</label>
        </li>
        <li>
            <input type="checkbox" checked id="address">
            <label for="address">Include addresses?</label>
        </li>
        <li>
            <input type="checkbox" checked id="icon">
            <label for="icon">Include icons?</label>
        </li>
    </ol>
    <p>
        <button id="butRequest" type="button" disabled>Open contact picker</button>
    </p>
    <p><b>Results</b></p>
    <ul id="results">
        <li>Results will be populated here.</li>
    </ul>
    <pre id="rawResults"></pre>
    <script src="demo.js"></script>
</body>
</html>
